name: Linux build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: "debian:bookworm"
            label: debian12-amd64
          - distribution: "debian:trixie"
            label: debian13-amd64
    container: ${{ matrix.distribution }}
    steps:
      - name: Install build and runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git file build-essential cmake ninja-build qt6-base-dev qt6-declarative-dev qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-dialogs qml6-module-qtquick-templates qml6-module-qtquick-window libqt6sql6-sqlite libqt6svg6 fonts-dejavu-core stockfish
          if apt-cache show qt6-svg-plugins >/dev/null 2>&1; then
            apt-get install -y --no-install-recommends qt6-svg-plugins
          fi
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package for this distribution
        run: cd build && cpack -G DEB
      - name: Verify installed package
        run: |
          apt-get install -y ./build/*.deb
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software trait64 --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: Trait64-${{ matrix.label }}
          path: build/*.deb
          retention-days: 30

  core-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DT64_BUILD_GUI=OFF -DT64_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
