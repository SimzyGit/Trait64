name: Build, test and release Trait64
on:
  push:
    branches: ['main']
    tags: ['v*']
    paths-ignore: ['docs/**', '*.md', '.github/workflows/storage.yml', 'scripts/cleanup-actions.py', 'tests/test_cleanup_actions.py']
  pull_request:
    paths-ignore: ['docs/**', '*.md', '.github/workflows/storage.yml', 'scripts/cleanup-actions.py', 'tests/test_cleanup_actions.py']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.3.0-beta.1 or 0.3.0; empty = development'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: trait64-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          REQUESTED: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          base=re.search(r'project\(Trait64 VERSION ([0-9.]+)',Path('CMakeLists.txt').read_text())[1]
          version=os.environ['REQUESTED'] or (os.environ['REF_NAME'][1:] if os.environ['REF_TYPE']=='tag' else base+'-dev.'+os.environ['RUN_NUMBER'])
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(beta|rc|dev)\.(0|[1-9][0-9]*))?',version):
              raise SystemExit('Invalid release version')
          publish=os.environ['EVENT_NAME']!='pull_request' and (os.environ['REF_TYPE']=='tag' or os.environ['REF_NAME']=='main')
          # An ordinary main-branch commit is ALWAYS a development prerelease.
          if os.environ['EVENT_NAME']=='push' and os.environ['REF_TYPE']!='tag' and '-dev.' not in version:
              raise SystemExit('Stable/beta publication requires a tag or manual release')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'version={version}\npublish={str(publish).lower()}\nprerelease={str("-" in version).lower()}\n')
          PY
  core-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Test publication and storage safeguards
        run: |
          python3 -m unittest discover -s tests -p 'test_publish_release.py' -v
          python3 -m unittest discover -s tests -p 'test_cleanup_actions.py' -v
          bash -n packaging/ci-linux.sh
      - run: cmake -S . -B build -DT64_BUILD_GUI=OFF -DT64_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  desktop-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install desktop and engine test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libarchive-dev libsqlite3-dev qt6-base-dev qt6-declarative-dev qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-dialogs qml6-module-qtquick-templates qml6-module-qtquick-window libqt6sql6-sqlite libqt6svg6 fonts-dejavu-core stockfish
      - run: cmake -S . -B build -G Ninja -DT64_SANITIZERS=ON -DT64_BENCHMARKS=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS_DEBUG='-O1 -g1'
      - run: cmake --build build --parallel 2
      - name: Test all modules with address and undefined behavior sanitizers
        env:
          T64_STOCKFISH: /usr/games/stockfish
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure
  # Livrables Windows et macOS. La publication les attend : une version n'est complète
  # que si les trois systèmes y figurent, et un utilisateur Windows ne doit pas tomber
  # sur une release qui ne contient que du Linux.
  windows:
    needs: version
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Bibliothèques Windows
        run: |
          vcpkg install libarchive:x64-windows sqlite3:x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
      # Sans la version, le binaire annonce celle par défaut et se croit indéfiniment
      # en retard : l'updater proposerait une mise à jour juste après l'installation.
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DT64_RELEASE_VERSION="${{ needs.version.outputs.version }}"
      - run: cmake --build build --config Release --parallel 3
      - name: Archive portable
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          # vcpkg dépose les DLL à côté de l'exécutable : on emporte tout le dossier,
          # pas seulement le binaire, sinon l'archive ne démarre pas sur une machine nue.
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item -Recurse build/Release stage/Trait64
          windeployqt --qmldir ui --release --no-translations stage/Trait64/trait64.exe
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md stage/Trait64
          Compress-Archive -Path stage/Trait64 -DestinationPath "Trait64-$env:RELEASE_VERSION-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: Trait64-*-windows-x86_64.zip
          if-no-files-found: error

  macos:
    needs: version
    # Image épinglée, comme ubuntu-24.04 et windows-2022 : « macos-latest » change sous
    # nos pieds. macos-14 a été retirée le 2 novembre 2026, et ses jobs n'obtenaient plus
    # d'exécutant — annulés en une seconde, ils annulaient la publication avec eux.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Bibliothèques macOS
        run: |
          brew install libarchive sqlite
          # CMake lit cette variable d'environnement avec le séparateur de la plateforme,
          # soit « : » ici. Avec « ; » le chemin entier passait pour un seul dossier et
          # LibArchive, keg-only chez Homebrew, restait introuvable.
          echo "CMAKE_PREFIX_PATH=$(brew --prefix libarchive):$(brew --prefix sqlite)${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
      # Même raison que pour Windows : la version nourrit aussi Info.plist, donc ce que
      # macOS affiche dans « À propos » et dans le Finder.
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DT64_RELEASE_VERSION="${{ needs.version.outputs.version }}"
      - run: cmake --build build --config Release --parallel 3
      - name: Paquet d'application et image disque
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p build/trait64.app/Contents/Resources
          cp LICENSE THIRD_PARTY_NOTICES.md build/trait64.app/Contents/Resources/
          macdeployqt build/trait64.app -qmldir=ui -dmg
          mv build/trait64.dmg "Trait64-${RELEASE_VERSION}-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: Trait64-*-macos-arm64.dmg
          if-no-files-found: error

  linux:
    needs: [version, core-sanitizers, desktop-sanitizers, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: trait64-delivery-${{ needs.version.outputs.publish == 'true' && 'publish' || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Debian 12 tests, installed package, AppImage and sources
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir packages captures
          docker run --rm --pull always --mount "type=bind,source=$PWD,target=/source,readonly" --mount "type=bind,source=$PWD/packages,target=/packages" --mount "type=bind,source=$PWD/captures,target=/captures" --workdir /source debian:bookworm bash packaging/ci-linux.sh 12 "$RELEASE_VERSION"
      # Les captures servent à relire la mise en page après coup ; elles ne conditionnent
      # rien et ne doivent jamais faire échouer une livraison saine.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-captures
          path: captures/
          if-no-files-found: ignore
      - name: Debian 13 tests and installed package
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          docker run --rm --pull always --mount "type=bind,source=$PWD,target=/source,readonly" --mount "type=bind,source=$PWD/packages,target=/packages" --workdir /source debian:trixie bash packaging/ci-linux.sh 13 "$RELEASE_VERSION"
      - name: Récupérer les paquets Windows et macOS
        uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: '*-package'
          merge-multiple: true
      - name: Verify complete package manifest
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: python3 scripts/publish-release.py packages "$RELEASE_VERSION" --check-only
      - name: Publish tested version directly to GitHub Releases
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: python3 scripts/publish-release.py packages "$RELEASE_VERSION"
